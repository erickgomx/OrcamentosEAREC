
<!DOCTYPE html>
<html lang="pt-BR" class="dark">
  <head>
    <!-- Evita FOUC (Flash of Unstyled Theme) -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('earec_theme');
          if (saved === 'light') {
            document.documentElement.classList.remove('dark');
            document.documentElement.classList.add('light');
          } else {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          }
        } catch(e) {}
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#080808" />
    <title>EAREC | Orçamento Facilitado</title>
    <meta name="description" content="Simule seu orçamento audiovisual em instantes. Fotografia, vídeo e produções cinematográficas com direcionamento direto para o WhatsApp." />

    <style>
      :root {
        /* Fallback Tokens */
        --brand-color: #DC2626;
        --brand-glow: rgba(220, 38, 38, 0.5);
      }
      * {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      html.dark body {
        background-color: #080808;
        color: #f4f4f5;
      }
      html.light body, html:not(.dark) body {
        background-color: #FFFFFF;
        color: #18181B;
      }
      /* Aceleração por Hardware (GPU) */
      .gpu-accelerated {
        transform: translate3d(0, 0, 0);
        backface-visibility: hidden;
        perspective: 1000px;
        will-change: transform, opacity;
      }
      /* Tipografia Moderna e Perfeita para Valores Monetários e Contadores */
      .font-price {
        font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif !important;
        font-feature-settings: 'tnum' on, 'lnum' on, 'zero' on;
        font-variant-numeric: tabular-nums lining-nums;
      }
      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #0a0a0a;
      }
      ::-webkit-scrollbar-thumb {
        background: #333;
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: var(--brand-color);
      }
      .leaflet-pane { z-index: 10 !important; }
      .leaflet-control { z-index: 20 !important; }
    </style>

<style>
  .text-no-break {

    hyphens: none !important;
  }
</style>
</head>
